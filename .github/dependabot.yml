version: 2
updates:
  # Dependency PRs target the permanent version branch so CI runs before
  # promotion to main; update target-branch when the release train advances.
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "v3.14"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      patch-and-minor:
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "v3.14"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
