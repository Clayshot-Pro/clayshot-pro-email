version: 2
updates:
  # Dependency PRs target the current version branch so CI runs before
  # promotion to main. Dependabot reads this file from main: set both
  # target-branch values to each new vX.XX branch when it is created.
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "v3.29"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      patch-and-minor:
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "v3.29"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
