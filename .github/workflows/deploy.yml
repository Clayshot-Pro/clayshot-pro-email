name: Deploy production

# Deploys main to Cloudflare, in this repository and in every fork. Do not also
# connect Cloudflare Workers Builds, or each push deploys twice.
# Needs CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as repository secrets.
# The first deploy of a new instance creates its D1 database and R2 bucket.
# Optional repository variables WORKER_NAME, D1_DATABASE_NAME, R2_BUCKET_NAME
# and D1_DATABASE_ID override the names in wrangler.jsonc, so an instance with
# other names keeps the committed file (and its fork) unmodified.
# Only main deploys: the triggers, the job condition and `npm run deploy`'s
# guard all refuse other branches and pull requests.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, migrate, and deploy
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check the Cloudflare secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          if [ -n "$missing" ]; then
            echo "::error title=Missing secrets::Add$missing under Settings → Secrets and variables → Actions → Repository secrets (forks do not copy secrets), then run this workflow again."
            exit 1
          fi
          if ! printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | grep -Eq '^[0-9a-fA-F]{32}$'; then
            echo "::error title=Invalid account ID::CLOUDFLARE_ACCOUNT_ID must be the 32-character Account ID from the Cloudflare dashboard (Workers & Pages → Account details)."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Generate browser favicon
        run: bash scripts/generate-favicon.sh

      - name: Type-check and build
        run: npm run build
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKER_NAME: ${{ vars.WORKER_NAME }}
          D1_DATABASE_NAME: ${{ vars.D1_DATABASE_NAME }}
          R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}

      - name: Apply D1 migrations and deploy
        run: |
          set -o pipefail
          npm run deploy 2>&1 | tee deploy.log
          url=$(grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' deploy.log | head -n 1 || true)
          {
            echo "### Deployed"
            if [ -n "$url" ]; then echo "Open $url to finish setup (or your custom domain once it is added)."; fi
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKER_NAME: ${{ vars.WORKER_NAME }}
          D1_DATABASE_NAME: ${{ vars.D1_DATABASE_NAME }}
          R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
