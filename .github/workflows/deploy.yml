name: Deploy production

# Deploys main to Cloudflare. Use this or Cloudflare Workers Builds, not both.
# Needs CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as repository secrets.
# Forks deploy with Workers Builds by default; a fork that prefers this
# workflow sets the repository variable DEPLOY_WITH_ACTIONS to true.
# Optional repository variables WORKER_NAME, D1_DATABASE_NAME, R2_BUCKET_NAME
# and D1_DATABASE_ID override the names in wrangler.jsonc, so an instance with
# other names keeps the committed file (and its fork) unmodified.
# Only main deploys: the triggers, the job condition and `npm run deploy`'s
# guard all refuse other branches and pull requests.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, migrate, and deploy
    if: github.ref == 'refs/heads/main' && (github.repository == 'LiamTheMo/LTM-Email-Service' || vars.DEPLOY_WITH_ACTIONS == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Generate browser favicon
        run: bash scripts/generate-favicon.sh

      - name: Type-check and build
        run: npm run build
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKER_NAME: ${{ vars.WORKER_NAME }}
          D1_DATABASE_NAME: ${{ vars.D1_DATABASE_NAME }}
          R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}

      - name: Apply D1 migrations and deploy
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKER_NAME: ${{ vars.WORKER_NAME }}
          D1_DATABASE_NAME: ${{ vars.D1_DATABASE_NAME }}
          R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
