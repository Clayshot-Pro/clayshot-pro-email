name: Security audit

on:
  pull_request:
    branches:
      - 'v[0-9]*.[0-9][0-9]'
  push:
    branches:
      - 'v[0-9]*.[0-9][0-9]'

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Full-history security scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch every public branch and tag
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --prune origin '+refs/heads/*:refs/remotes/origin/*'
          git fetch --force --tags origin
          echo "Fetched $(git for-each-ref --format='%(refname)' refs/remotes/origin refs/tags | wc -l | tr -d ' ') refs for scanning."

      - name: Audit history for sensitive artifact paths
        id: path_audit
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail

          git rev-list --objects --all \
            | awk 'NF > 1 { $1=""; sub(/^ /, ""); print }' \
            | sort -u \
            > history-paths.txt

          grep -E -i '(^|/)(\.dev\.vars|\.env($|\.)|id_rsa$|id_ed25519$)|\.(pem|key|p12|pfx|sqlite|sqlite3|db|eml|mbox|bak)$' \
            history-paths.txt \
            | grep -E -v '(^|/)\.env(\.[^/]*)?\.example$|(^|/)\.env\.example$' \
            > sensitive-history-paths.txt || true

          if [[ -s sensitive-history-paths.txt ]]; then
            echo "Potentially sensitive historical artifact paths were detected." >&2
            exit 1
          fi

      - name: Scan all refs with Gitleaks
        id: gitleaks
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo" \
            -w /repo \
            ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git . \
            --redact=100 \
            --report-format=json \
            --report-path=/repo/gitleaks-report.json

      - name: Create sanitized findings report
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -s gitleaks-report.json ]]; then
            jq -r '.[] | [(.RuleID // "unknown"), (.File // "unknown"), ((.StartLine // 0) | tostring), ((.Commit // "unknown")[0:40])] | @tsv' \
              gitleaks-report.json > gitleaks-findings.tsv
          else
            : > gitleaks-findings.tsv
          fi

          if [[ ! -f sensitive-history-paths.txt ]]; then
            : > sensitive-history-paths.txt
          fi

      - name: Upload sanitized findings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-sanitized-findings
          path: |
            gitleaks-findings.tsv
            sensitive-history-paths.txt
          if-no-files-found: error
          retention-days: 7

      - name: Publish sanitized scan result
        if: always()
        shell: bash
        env:
          PATH_AUDIT_OUTCOME: ${{ steps.path_audit.outcome }}
          SCAN_OUTCOME: ${{ steps.gitleaks.outcome }}
        run: |
          set -euo pipefail
          failed=0

          {
            echo "## Full-history security scan"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ -s sensitive-history-paths.txt ]]; then
            path_count="$(wc -l < sensitive-history-paths.txt | tr -d ' ')"
            {
              echo "Detected **${path_count}** potentially sensitive historical artifact path(s):"
              echo
              while IFS= read -r path; do
                echo "- \`${path}\`"
              done < sensitive-history-paths.txt
              echo
            } >> "$GITHUB_STEP_SUMMARY"
            failed=1
          elif [[ "$PATH_AUDIT_OUTCOME" != "success" ]]; then
            echo "The historical artifact-path audit failed without producing findings. Treating this as a scan failure." >> "$GITHUB_STEP_SUMMARY"
            echo >> "$GITHUB_STEP_SUMMARY"
            failed=1
          else
            echo "No sensitive mailbox/database/key artifact paths were detected across fetched history." >> "$GITHUB_STEP_SUMMARY"
            echo >> "$GITHUB_STEP_SUMMARY"
          fi

          if [[ -s gitleaks-findings.tsv ]]; then
            finding_count="$(wc -l < gitleaks-findings.tsv | tr -d ' ')"
            {
              echo "Gitleaks detected **${finding_count}** potential secret finding(s). Secret values are not included."
              echo
              while IFS=$'\t' read -r rule file line commit; do
                echo "- \`${rule}\` in \`${file}:${line}\` at commit \`${commit:0:12}\`"
              done < gitleaks-findings.tsv
            } >> "$GITHUB_STEP_SUMMARY"
            failed=1
          elif [[ "$SCAN_OUTCOME" != "success" ]]; then
            echo "Gitleaks failed without producing findings. Treating this as a scan failure." >> "$GITHUB_STEP_SUMMARY"
            failed=1
          else
            echo "No potential secrets were detected across the fetched branch/tag history." >> "$GITHUB_STEP_SUMMARY"
          fi

          if [[ "$failed" -ne 0 ]]; then
            echo "Repository history security audit failed." >&2
            exit 1
          fi
