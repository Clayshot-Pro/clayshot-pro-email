name: Validate development

on:
  push:
    branches:
      - 'v[0-9]+.[0-9][0-9]'
  pull_request:
    branches:
      - 'v[0-9]+.[0-9][0-9]'

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Type-check and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Audit production dependencies for high severity advisories
        run: npm audit --omit=dev --audit-level=high

      - name: Generate browser favicon
        run: bash scripts/generate-favicon.sh

      - name: Type-check and build
        run: npm run build

      - name: Native mailbox migration smoke test
        run: python3 scripts/test-mailbox-migration.py

      - name: Regression suite (config, auth boundary, mailbox rules, domains, transports, theming)
        run: npm test

      - name: Cloudflare Workers password-runtime integration
        run: |
          set -euo pipefail
          ./node_modules/.bin/wrangler dev --config scripts/password-runtime.wrangler.jsonc --local --port 8789 --ip 127.0.0.1 > /tmp/password-runtime.log 2>&1 &
          RUNTIME_PID=$!
          trap 'kill "$RUNTIME_PID" 2>/dev/null || true' EXIT
          if ! node scripts/test-worker-password-runtime.mjs; then
            cat /tmp/password-runtime.log
            exit 1
          fi
